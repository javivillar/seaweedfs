name: refresquito-bucket-authz-build

# Same isolation pattern as the other refresquito-*-build.yml workflows:
# its own tag, never touches refresquito-trusted-proxy-login (production).

on:
  push:
    branches: [refresquito-bucket-authz]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.refresquito
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/seaweedfs:refresquito-bucket-authz
            ghcr.io/${{ github.repository_owner }}/seaweedfs:${{ github.sha }}
