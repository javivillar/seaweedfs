name: refresquito-object-ownership-build

# Same pattern as refresquito-oidc-build.yml: its own tag, never the
# production refresquito-trusted-proxy-login tag, so testing this
# still-unverified feature branch can't affect what's actually deployed.

on:
  push:
    branches: [refresquito-object-ownership]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.refresquito
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/seaweedfs:refresquito-object-ownership
            ghcr.io/${{ github.repository_owner }}/seaweedfs:${{ github.sha }}
